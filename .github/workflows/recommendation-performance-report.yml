name: maeemoji-recommendation-performance-report

on:
  workflow_dispatch:

concurrency:
  group: maeemoji-recommendation-performance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DATABASE_URL
    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${{ secrets.DATABASE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew
        working-directory: backend

      - name: Print recommendation performance report
        run: ./gradlew bootRun --args="--spring.main.web-application-type=none --maemoji.batch.run-once=recommendation-performance-report"
        working-directory: backend
